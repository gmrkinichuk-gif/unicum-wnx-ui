name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: build/as3/royale
          key: royale-${{ hashFiles('tools/build_as3.py') }}
      - name: Build flag images and icons
        run: |
          npm --prefix tools/flags ci --no-audit --no-fund
          npm --prefix tools/flags run build
          npm --prefix tools/badges ci --no-audit --no-fund
          npm --prefix tools/badges run icon
      - name: Check UI geometry
        run: |
          node tools/check_roster_grid.mjs
          node tools/check_battle_ui.mjs
          node tools/check_settings_ui.mjs
      - name: Compile with mirrored client inputs (never distribute)
        # The initial run timed out after 35 minutes without output. Cap this
        # dependency/compile step separately and stream Python progress logs.
        run: timeout --signal=TERM --kill-after=30s 1080s python -u tools/build_as3.py --from-mirror
      - name: Build and check temporary package (never publish)
        shell: bash
        run: |
          set -eu
          chmod +x tools/ci/python27
          version=$(sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?)$/\1/p' CHANGELOG.md | head -1)
          test -n "$version"
          python tools/build_release.py --version "$version" --python27 tools/ci/python27 --game-version 0.0.0.0
          tools/ci/python27 -B tools/selftest.py
          tools/ci/python27 -B tools/release_check.py "dist/gg.unicum_$version.wotmod"
