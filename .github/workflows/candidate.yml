name: candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/client-files
        id: client
      - uses: actions/cache@v4
        with:
          path: build/as3/royale
          key: royale-${{ hashFiles('tools/build_as3.py') }}
      - name: Build and check candidate
        env:
          MODS: ${{ steps.client.outputs.mods }}
        shell: bash
        run: |
          set -eu
          version=$(sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' CHANGELOG.md | head -1)
          test -n "$version"
          npm --prefix tools/flags ci --no-audit --no-fund
          npm --prefix tools/flags run build
          npm --prefix tools/badges ci --no-audit --no-fund
          npm --prefix tools/badges run icon
          node tools/check_roster_grid.mjs
          node tools/check_battle_ui.mjs
          python tools/build_as3.py --client-files build/client-files
          chmod +x tools/ci/python27
          python tools/build_release.py --version "$version" --python27 tools/ci/python27 --game-version "$MODS"
          tools/ci/python27 -B tools/selftest.py
          tools/ci/python27 -B tools/release_check.py "dist/gg.unicum_$version.wotmod"
          cp build/client-files/manifest.json dist/client.json
          (cd dist && sha256sum *.wotmod *.zip client.json > SHA256SUMS.txt)
      - name: Store candidate for in-game validation (not a Release)
        uses: actions/upload-artifact@v4
        with:
          name: candidate-needs-in-game-validation-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
